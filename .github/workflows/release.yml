# Builds, signs, notarizes and checks a release on GitHub's machines. Run by
# hand. app/scripts/set-ci-secrets.sh, run once on a Mac holding the certificate,
# gives it what it needs.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release, like v0.3.0
        required: true
      publish:
        description: Publish the release (off for a rehearsal)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      MAC_CERT: ${{ secrets.MAC_CERT_P12 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      UPDATER_KEY: ${{ secrets.RELAIS_UPDATER_KEY }}
    steps:
      - name: Stop when a secret is missing
        run: |
          for name in MAC_CERT MAC_CERT_PASSWORD APPLE_API_KEY NOTARY_KEY_ID NOTARY_ISSUER UPDATER_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set: run app/scripts/set-ci-secrets.sh"
              exit 1
            fi
          done
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm --dir app install --frozen-lockfile
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Import the certificate
        run: |
          echo "$MAC_CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$RUNNER_TEMP" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$RUNNER_TEMP" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" build.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Build, notarize and check
        run: |
          printf '%s' "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$UPDATER_KEY" > "$RUNNER_TEMP/updater.key"
          identity="$(security find-identity -v -p codesigning | sed -nE 's/.*"(Developer ID Application:[^"]+)".*/\1/p' | head -1)"
          NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8" RELAIS_UPDATER_KEY_FILE="$RUNNER_TEMP/updater.key" \
            RELAIS_CODESIGN_IDENTITY="$identity" app/scripts/release-macos.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relais-${{ inputs.tag }}
          path: target/release-macos/*
      - name: Publish
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" target/release-macos/* --title "Relais ${{ inputs.tag }}" --generate-notes --latest
