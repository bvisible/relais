name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm --dir app install --frozen-lockfile
      - run: pnpm --dir app build
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: pnpm --dir app test
      - run: bash -n app/scripts/build-macos.sh app/scripts/release-macos.sh app/scripts/verify-macos.sh

  intel:
    # The widget and the app are checked by verify-macos.sh; this one proves the
    # command runs on a real Intel Mac, which no Apple Silicon machine can without Rosetta.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm --dir app install --frozen-lockfile
      - run: pnpm --dir app build
      - run: cargo test -p relais-core -p relais-cli
