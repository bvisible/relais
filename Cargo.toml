[workspace]
resolver = "2"
members = ["crates/relais-core", "crates/relais-cli", "app/src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bvisible/relais"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
